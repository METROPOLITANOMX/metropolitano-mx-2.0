<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metropolitano MX Pro — App Android y Acceso Directo PWA</title>
  <meta name="description" content="Cronometraje por visión artificial, telemetría en vivo, campeonatos MXGP y garaje Pro para motos RC Losi Promoto-MX y SM." />
  <meta name="theme-color" content="#f5b942" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root {
      --bg: #0b0d11;
      --card: rgba(20, 24, 32, 0.86);
      --border: rgba(255, 255, 255, 0.11);
      --gold: #f5b942;
      --red: #e63946;
      --green: #2ec4b6;
      --text: #f3f5f8;
      --muted: #9aa4b2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 18% 12%, rgba(230, 57, 70, 0.22), transparent 42%),
        radial-gradient(circle at 82% 18%, rgba(245, 185, 66, 0.18), transparent 40%),
        linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%),
        linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%);
      background-size: auto, auto, 16px 16px, 16px 16px;
      background-position: 0 0, 0 0, 0 0, 8px 8px;
      display: flex;
      justify-content: center;
      padding: 28px 16px 48px;
    }
    .container { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 20px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      background: rgba(245, 185, 66, 0.14); border: 1px solid rgba(245, 185, 66, 0.35); color: var(--gold);
    }
    .lang-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .hero {
      background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      padding: 32px 24px; text-align: center; backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .logo {
      width: 148px; height: 148px; object-fit: contain; margin: 0 auto 16px; display: block;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.65));
    }
    h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 900; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 10px; }
    .subtitle { color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 560px; margin: 0 auto 24px; }
    .cta-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 16px; }
    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px 26px; border-radius: 14px; font-size: 16px; font-weight: 800; text-decoration: none;
      color: #111318; background: linear-gradient(135deg, #ffd166, #f5b942);
      box-shadow: 0 10px 28px rgba(245, 185, 66, 0.32);
    }
    .btn-pwa {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 22px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer;
      color: #071412; background: linear-gradient(135deg, #4ade80, #2ec4b6); border: none;
      box-shadow: 0 10px 24px rgba(46, 196, 182, 0.28);
    }
    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 20px; border-radius: 14px; font-size: 14px; font-weight: 700; text-decoration: none;
      color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
    }
    .release-meta { font-size: 13px; color: var(--muted); min-height: 20px; }
    .release-meta strong { color: var(--green); }
    .pwa-hint { font-size: 12.5px; color: var(--green); margin-top: 8px; }
    .notice {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px;
      background: rgba(230, 57, 70, 0.12); border: 1px solid rgba(230, 57, 70, 0.35);
      font-size: 13px; line-height: 1.5; color: #ffd6da; display: none; text-align: left;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 18px; backdrop-filter: blur(10px);
    }
    .card h2 { font-size: 15px; font-weight: 800; margin-bottom: 8px; color: var(--gold); }
    .card p, .card li { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    .steps ol { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
    footer { text-align: center; font-size: 12.5px; color: var(--muted); padding-top: 6px; }
    footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>
  <main class="container">
    <div class="topbar">
      <span class="badge">LOSI PROMOTO 1/4 • ANDROID APK + PWA</span>
      <button class="lang-btn" id="langToggle" type="button">EN / ES</button>
    </div>

    <section class="hero">
      <img
        id="heroLogo"
        class="logo"
        src="./icon-512.png"
        alt="Metropolitano MX Pro Logo"
        onerror="this.src='https://raw.githubusercontent.com/metropolitanomx/metropolitano-mx-2.0/main/public/assets/aistudio/logo_992d847b.png'"
      />
      <h1>Metropolitano MX Pro</h1>
      <p class="subtitle" id="subtitleText"></p>
      <div class="cta-group">
        <a class="btn-primary" id="downloadBtn" href="#">⬇ <span id="downloadLabel"></span></a>
        <button class="btn-pwa" id="installPwaBtn" type="button">📲 <span id="installPwaLabel"></span></button>
        <a class="btn-secondary" id="releasesBtn" href="#" target="_blank" rel="noopener"><span id="releasesLabel"></span></a>
      </div>
      <div class="release-meta" id="releaseMeta"></div>
      <div class="pwa-hint" id="pwaHint"></div>
      <div class="notice" id="pendingNotice"></div>
    </section>

    <section class="grid">
      <article class="card"><h2 id="f1Title"></h2><p id="f1Body"></p></article>
      <article class="card"><h2 id="f2Title"></h2><p id="f2Body"></p></article>
      <article class="card"><h2 id="f3Title"></h2><p id="f3Body"></p></article>
    </section>

    <section class="card steps">
      <h2 id="stepsTitle"></h2>
      <ol id="stepsList"></ol>
    </section>

    <footer>
      <a id="repoLink" href="#" target="_blank" rel="noopener">GitHub Repository</a>
      •
      <a id="actionsLink" href="#" target="_blank" rel="noopener">GitHub Actions</a>
    </footer>
  </main>

  <script>
    (function () {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      }

      let deferredPrompt = null;
      const installPwaBtn = document.getElementById("installPwaBtn");
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });

      const hostParts = window.location.hostname.split(".");
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const isGhPages = window.location.hostname.endsWith(".github.io") && hostParts.length >= 3 && pathParts.length >= 1;
      const owner = isGhPages ? hostParts[0] : "metropolitanomx";
      const repo = isGhPages ? pathParts[0] : "metropolitano-mx-2.0";

      const repoUrl = `https://github.com/${owner}/${repo}`;
      const releasesUrl = `${repoUrl}/releases`;
      const actionsUrl = `${repoUrl}/actions`;
      const downloadBtn = document.getElementById("downloadBtn");
      const releaseMeta = document.getElementById("releaseMeta");
      const pendingNotice = document.getElementById("pendingNotice");
      const pwaHint = document.getElementById("pwaHint");

      downloadBtn.href = `${releasesUrl}/latest/download/MetropolitanoMXPro.apk`;
      document.getElementById("releasesBtn").href = releasesUrl;
      document.getElementById("repoLink").href = repoUrl;
      document.getElementById("actionsLink").href = actionsUrl;

      let lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
      const copy = {
        es: {
          subtitle: "Cronometraje oficial por cámara en línea de meta, modo Antena Solo para entrenar en cualquier descampado, parking o circuito, campeonatos MXGP y garaje Pro para Losi Promoto 1/4.",
          download: "Descargar APK Android",
          installPwa: "Instalar Acceso Directo (Sin avisos)",
          releases: "Ver Releases / Versiones",
          pwaHint: "Menú Chrome (⋮) → 'Instalar aplicación' / 'Crear acceso directo' instala este portal Web sin avisos. El APK completo usa cámara y Bluetooth nativo.",
          f1Title: "📸 Antena Cámara + Antena Solo",
          f1Body: "Usa teléfonos dedicados en meta o activa \"Mi Móvil como Antena\" desde tu perfil de piloto para publicar tus vueltas automáticamente.",
          f2Title: "🏆 Campeonatos y Modos",
          f2Body: "Puntuación MXGP por mangas, Duelo Metrónomo, Turbo Sprint 3 Vueltas, Caza al Líder, Bomba Reloj y Rey de la Pista.",
          f3Title: "⚡ Sincronización en Vivo",
          f3Body: "Todos los pilotos y aficionados conectados al mismo tiempo con compensación exacta de reloj del servidor Firebase.",
          stepsTitle: "Cómo instalar sin dudas (APK nativa vs Acceso Directo Chrome)",
          steps: [
            "<strong>Opción Web / Acceso Directo (⋮ en Chrome, sin aviso):</strong> Toca el botón verde o abre el menú de Chrome (<strong>⋮</strong> arriba a la derecha) y pulsa <strong>Instalar aplicación / Crear acceso directo</strong>. Ese método nunca muestra aviso de archivo dañino porque es un acceso PWA del navegador.",
            "<strong>Opción APK Completa (Cámara 60fps, Vision Lab y Modo Bolsillo):</strong> Pulsa <strong>Descargar APK Android</strong>. En cualquier APK descargado fuera de Google Play Store, Android muestra siempre el aviso estándar <em>'Es posible que el archivo sea dañino'</em> — pulsa <strong>Descargar de todos modos</strong>.",
            "Abre el APK en Descargas, permite <strong>Instalar aplicaciones desconocidas</strong> en tu navegador y toca <strong>Instalar</strong>.",
            "Abre <strong>MX Pro</strong>, elige tu moto en Garaje Pro y entra a <strong>Sala Pista</strong>."
          ],
          checking: "Buscando última compilación...",
          ready: (tag, mb) => `Última versión lista: <strong>${tag}</strong> • ${mb} MB`,
          noRelease: `Aún no hay un APK publicado en Releases. Entra en <a href="${actionsUrl}" target="_blank" rel="noopener" style="color:#ffd166;font-weight:700;">GitHub Actions</a> para verificar que el workflow <strong>Build & Publish Android APK</strong> haya terminado.`
        },
        en: {
          subtitle: "Camera-based finish-line lap timing, Solo Rider Phone-as-Antenna mode for any parking lot, yard, or track, MXGP championships, and Losi Promoto 1/4 Pro Garage.",
          download: "Download Android APK",
          installPwa: "Install Web Shortcut (No APK warning)",
          releases: "View Releases",
          pwaHint: "Chrome menu (⋮) → 'Install app' / 'Add to Home screen' installs this web portal cleanly. Full APK enables native camera timing & pocket audio.",
          f1Title: "📸 Finish-Line & Solo Antenna",
          f1Body: "Use dedicated finish-line phones or enable \"My Phone as Antenna\" in your rider profile to auto-publish laps live.",
          f2Title: "🏆 Championships & Modes",
          f2Body: "MXGP heat standings, Consistency Duel, Turbo Sprint 3, Pursuit Hunter, Time Bomb, Elimination & King of Track.",
          f3Title: "⚡ Live Clock Sync",
          f3Body: "Riders and fans stay synced in real time with Firebase server clock offset compensation.",
          stepsTitle: "How to install (Native APK vs Chrome 3-dot Shortcut)",
          steps: [
            "<strong>Web Shortcut (Chrome ⋮ menu, zero warning):</strong> Tap the green button or open Chrome's top-right <strong>⋮</strong> menu → <strong>Install app / Add to Home screen</strong>. Browsers install Web Apps cleanly without harmful-file warnings.",
            "<strong>Full Native APK (High-FPS Camera, Lab Color Vision, Pocket Audio):</strong> Tap <strong>Download Android APK</strong>. Android warns on all APKs outside Google Play Store ('File might be harmful') — tap <strong>Download anyway</strong>.",
            "Open the downloaded APK, allow <strong>Install unknown apps</strong> for your browser, and tap <strong>Install</strong>.",
            "Launch <strong>MX Pro</strong>, pick your bike in Pro Garage, and enter <strong>Track Room</strong>."
          ],
          checking: "Checking latest build...",
          ready: (tag, mb) => `Latest build ready: <strong>${tag}</strong> • ${mb} MB`,
          noRelease: `No APK release published yet. Open <a href="${actionsUrl}" target="_blank" rel="noopener" style="color:#ffd166;font-weight:700;">GitHub Actions</a> and ensure <strong>Build & Publish Android APK</strong> completed.`
        }
      };

      let cachedRelease = null;
      function renderLang() {
        const t = copy[lang];
        document.documentElement.lang = lang;
        document.getElementById("subtitleText").textContent = t.subtitle;
        document.getElementById("downloadLabel").textContent = t.download;
        document.getElementById("installPwaLabel").textContent = t.installPwa;
        document.getElementById("releasesLabel").textContent = t.releases;
        pwaHint.textContent = t.pwaHint;
        document.getElementById("f1Title").textContent = t.f1Title;
        document.getElementById("f1Body").textContent = t.f1Body;
        document.getElementById("f2Title").textContent = t.f2Title;
        document.getElementById("f2Body").textContent = t.f2Body;
        document.getElementById("f3Title").textContent = t.f3Title;
        document.getElementById("f3Body").textContent = t.f3Body;
        document.getElementById("stepsTitle").textContent = t.stepsTitle;
        document.getElementById("stepsList").innerHTML = t.steps.map(s => `<li>${s}</li>`).join("");
        if (cachedRelease === false) {
          releaseMeta.textContent = "";
          pendingNotice.style.display = "block";
          pendingNotice.innerHTML = t.noRelease;
        } else if (cachedRelease) {
          pendingNotice.style.display = "none";
          releaseMeta.innerHTML = t.ready(cachedRelease.tag, cachedRelease.mb);
        } else {
          releaseMeta.textContent = t.checking;
        }
      }

      installPwaBtn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
        } else {
          alert(copy[lang].pwaHint);
        }
      });

      document.getElementById("langToggle").addEventListener("click", () => {
        lang = lang === "es" ? "en" : "es";
        renderLang();
      });
      renderLang();

      fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`)
        .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
        .then(data => {
          const apk = (data.assets || []).find(a => a.name.toLowerCase().endsWith(".apk"));
          if (apk) {
            downloadBtn.href = apk.browser_download_url;
            cachedRelease = { tag: data.tag_name || "latest", mb: (apk.size / (1024 * 1024)).toFixed(1) };
          } else {
            cachedRelease = false;
          }
          renderLang();
        })
        .catch(() => { cachedRelease = false; renderLang(); });
    })();
  </script>
</body>
</html>
